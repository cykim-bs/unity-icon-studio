<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- The OS window title stays "Icon Studio" in every language (scripts find the window by it) -->
    <title>Icon Studio</title>
    <script src="/theme-boot.js"></script>
    <link rel="stylesheet" href="/src/app.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <!--
      Frame from unity-slot-widget (src/shell): no OS frame; the header strip of each column
      (.col-header) reaches the top edge and together they form the title bar. Columns: side panel
      (#nav: projects, runs, styles), the prefab grid (free width), the details (#body-main, sized at
      its left edge). Texts come from data-t keys (src/i18n).
    -->
    <div id="app" data-nav="open" data-body="open" data-sheet="closed" class="frame-card no-anim">
      <button id="nav-toggle" class="icon-btn" type="button" aria-controls="nav" aria-expanded="true">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2" /><path d="M6.25 2.75v10.5" /></svg>
      </button>

      <nav id="nav" data-t-aria="nav.label">
        <div class="nav-inner">
          <header class="col-header drag-region">
            <div id="nav-tabs" role="tablist" data-t-aria="nav.tabs">
              <button id="tab-projects" class="icon-btn nav-tab" type="button" role="tab" data-tab="projects" aria-controls="panel-projects" aria-selected="true" data-t-title="nav.projectsKey" data-t-aria="nav.projects">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.75 4.25v8.5a.75.75 0 0 0 .75.75h11a.75.75 0 0 0 .75-.75v-6.5a.75.75 0 0 0-.75-.75H7.5L6 3.5H2.5a.75.75 0 0 0-.75.75z" /></svg>
              </button>
              <button id="tab-runs" class="icon-btn nav-tab" type="button" role="tab" data-tab="runs" aria-controls="panel-runs" aria-selected="false" data-t-title="nav.runsKey" data-t-aria="nav.runs">
                <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.25" /><path d="M8 4.75V8l2.25 1.5" /></svg>
                <span class="nav-badge" hidden></span>
              </button>
              <button id="tab-packs" class="icon-btn nav-tab" type="button" role="tab" data-tab="packs" aria-controls="panel-packs" aria-selected="false" data-t-title="nav.packsKey" data-t-aria="nav.packs">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.75l1.6 3.9 4.15.35-3.15 2.75.95 4.1L8 10.65l-3.55 2.2.95-4.1L2.25 6l4.15-.35z" /></svg>
              </button>
            </div>
          </header>
          <section id="panel-projects" class="nav-panel" role="tabpanel" aria-labelledby="tab-projects">
            <div class="panel-head">
              <h2 data-t="nav.projects"></h2>
              <button id="project-add" class="icon-btn small" type="button" data-t-title="projects.addKey" data-t-aria="projects.add">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.25v9.5M3.25 8h9.5" /></svg>
              </button>
            </div>
            <div id="projects-body" class="panel-body"></div>
          </section>
          <section id="panel-runs" class="nav-panel" role="tabpanel" aria-labelledby="tab-runs" hidden>
            <div class="panel-head"><h2 data-t="nav.runs"></h2></div>
            <div id="runs-body" class="panel-body"><p class="panel-empty" data-t="runs.empty"></p></div>
          </section>
          <section id="panel-packs" class="nav-panel" role="tabpanel" aria-labelledby="tab-packs" hidden>
            <div class="panel-head"><h2 data-t="nav.packs"></h2></div>
            <div id="packs-body" class="panel-body"><p class="panel-empty" data-t="packs.empty"></p></div>
          </section>
        </div>
      </nav>

      <header id="list-head" class="col-header drag-region">
        <span id="project-title" class="head-title"></span>
      </header>

      <div id="banner" role="status" hidden>
        <span id="banner-text"></span>
        <span id="banner-actions"></span>
        <button id="banner-close" class="icon-btn small" type="button"></button>
      </div>

      <section id="list-main">
        <div id="list-tools" hidden>
          <label id="find">
            <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.25" /><path d="M10.25 10.25l3.5 3.5" /></svg>
            <input id="find-input" type="search" autocomplete="off" spellcheck="false" data-t-placeholder="find.placeholder" data-t-aria="find.label" />
          </label>
          <div id="class-chips" class="chip-group" role="group" data-t-aria="prefabs.classes"></div>
          <div id="kind-chips" class="chip-group" role="group" data-t-aria="prefabs.kinds"></div>
          <button id="folder-btn" class="pick-btn" type="button" aria-haspopup="menu" data-t-aria="prefabs.folder">
            <span class="pick-label"></span>
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 6.25L8 9.75l3.5-3.5" /></svg>
          </button>
          <span id="list-count" class="muted"></span>
          <span class="spacer"></span>
          <button id="thumbs-btn" class="act-btn small" type="button" data-t="thumbs.make" data-t-title="thumbs.title"></button>
          <button id="list-more" class="icon-btn" type="button" aria-haspopup="menu" data-t-title="prefabs.more" data-t-aria="prefabs.more">
            <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3.5" cy="8" r="1.15" fill="currentColor" stroke="none" /><circle cx="8" cy="8" r="1.15" fill="currentColor" stroke="none" /><circle cx="12.5" cy="8" r="1.15" fill="currentColor" stroke="none" /></svg>
          </button>
        </div>
        <div id="list" tabindex="0" data-t-aria="prefabs.label"><div id="list-inner"></div></div>
      </section>

      <div id="body-resizer" role="separator" aria-orientation="vertical" tabindex="0" data-t-aria="resizer.label" data-t-title="resizer.title"></div>

      <header id="body-head" class="col-header drag-region"><span id="body-title" data-t="body.title"></span></header>

      <main id="body-main" tabindex="-1" data-t-aria="body.label">
        <div id="sheet-head">
          <button id="sheet-back" class="icon-btn small" type="button" data-t-title="sheet.back" data-t-aria="sheet.back">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 4L6 8l4 4" /></svg>
          </button>
          <span id="sheet-title"></span>
        </div>
        <div id="body-content"></div>
      </main>

      <div id="title-controls" class="drag-region">
        <button id="settings-btn" class="icon-btn" type="button" data-t-title="titlebar.settingsKey" data-t-aria="titlebar.settings">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2" /><path d="M6.9 1.75h2.2l.35 1.7 1.2.7 1.65-.55 1.1 1.9-1.3 1.15v1.4l1.3 1.15-1.1 1.9-1.65-.55-1.2.7-.35 1.7H6.9l-.35-1.7-1.2-.7-1.65.55-1.1-1.9 1.3-1.15v-1.4l-1.3-1.15 1.1-1.9 1.65.55 1.2-.7z" /></svg>
        </button>
        <div id="window-controls">
          <button id="win-min" type="button">&#xE921;</button>
          <button id="win-max" type="button">&#xE922;</button>
          <button id="win-close" type="button">&#xE8BB;</button>
        </div>
      </div>

      <footer id="statusbar">
        <button id="status-path" type="button"></button>
        <span class="spacer"></span>
        <span id="status-mode" data-drop="3"></span>
        <button id="status-ready" type="button" data-drop="2"></button>
        <span id="status-progress"><span id="status-busy" class="busy-dot" hidden></span><span id="status-progress-text"></span></span>
        <span id="status-today" data-drop="1"></span>
        <button id="status-version" type="button" data-drop="4"></button>
      </footer>
      <!-- Status bar notices (flashStatus), read out by screen readers -->
      <div id="status-live" class="sr-only" role="status"></div>

      <dialog id="app-dialog" class="modal" aria-labelledby="dialog-title" aria-describedby="dialog-message">
        <form method="dialog">
          <h2 id="dialog-title"></h2>
          <p id="dialog-message"></p>
          <p id="dialog-detail" hidden></p>
          <input id="dialog-input" type="text" hidden autocomplete="off" spellcheck="false" aria-labelledby="dialog-title" aria-describedby="dialog-message" />
          <div class="dialog-actions"></div>
        </form>
      </dialog>

      <!-- Settings (src/shell/settings-dialog.ts): tabs and items come from src/settings.ts -->
      <dialog id="settings-dialog" class="modal" aria-labelledby="settings-title">
        <!-- novalidate: every item is fitted when it is stored; a field the browser finds invalid must not keep the popup from closing -->
        <form method="dialog" novalidate>
          <header class="modal-head">
            <h2 id="settings-title" data-t="settings.title"></h2>
            <button class="icon-btn small" type="submit" value="close" data-t-title="settings.close" data-t-aria="settings.close">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" /></svg>
            </button>
          </header>
          <div id="settings-body"></div>
          <footer class="modal-foot">
            <span class="modal-note" data-t="settings.note"></span>
            <button id="settings-reset" type="button" data-t="settings.resetAll"></button>
          </footer>
        </form>
      </dialog>

      <div id="context-menu" popover role="menu"></div>
    </div>
  </body>
</html>
